[build]
  publish = "."
  command = ""
  # No redeployar cuando el panel solo cambia contenido o fotos (la web los lee en vivo desde GitHub)
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)content' ':(exclude)img/uploads'"

[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Mudanza a Cloudflare Pages: cuando Netlify vuelva a deployar, todo redirige al sitio nuevo
[[redirects]]
  from = "/*"
  to = "https://maipumuebles.pages.dev/:splat"
  status = 301
  force = true
